<!DOCTYPE html>
<html>
<head>
    <title>FoodSave - Donor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">FoodSave</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<div class="dashboard">

    <h1>Donor Dashboard</h1>
    <p>Welcome to FoodSave!</p>

    <div class="dashboard-cards">

        <div class="dashboard-card">
            <h2>0</h2>
            <p>Total Donations</p>
        </div>

        <div class="dashboard-card">
            <h2>0</h2>
            <p>Pending Donations</p>
        </div>

        <div class="dashboard-card">
            <h2>0</h2>
            <p>Completed Donations</p>
        </div>

    </div>

    <div class="dashboard-buttons">

        <button onclick="location.href='donate.html'">
            + Donate Food
        </button>

        <button onclick="location.href='my-donations.html'">
            My Donations
        </button>

    </div>

</div>

</body>
</html>
