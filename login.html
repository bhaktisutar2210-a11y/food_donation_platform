<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodSave - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: white;
            box-shadow: 0 2px 5px #ddd;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #2e7d32;
        }

        nav a {
            text-decoration: none;
            margin-left: 25px;
            color: #333;
            font-size: 16px;
        }

        nav a:hover {
            color: #2e7d32;
        }

        .login-section {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #ccc;
        }

        .login-box h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #256628;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-text a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

        .home-link:hover {
            color: #2e7d32;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">FoodSave</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>


    <section class="login-section">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p>Login to FoodSave</p>

            <form onsubmit="loginUser(event)">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <div class="register-text">
                Don't have an account?
                <a href="register.html">Register</a>
            </div>


            <a href="index.html" class="home-link">
                ← Back to Home
            </a>

        </div>

    </section>


    <footer>
        <p>© 2026 FoodSave - Food Donation Platform</p>
    </footer>


    <script>
        function loginUser(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            if (email !== "" && password !== "") {

                alert("Login Successful!");

                window.location.href = "donor.html";

            } else {

                alert("Please enter Email and Password.");

            }
        }
    </script>

</body>
</html>
